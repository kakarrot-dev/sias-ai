<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>前台交互与人工协作 · 数字员工设计</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#293528;background:#f3f5ef;font-size:15px;line-height:1.65;--green:#526844;--line:#dce2d5;--muted:#6e7869}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:8px;padding:8px 15px;color:inherit}button:hover{border-color:var(--green)}button:disabled{cursor:default;opacity:.5}.primary{background:var(--green);color:white;border-color:var(--green)}.subtle{background:transparent}header{max-width:1420px;margin:auto;padding:32px 36px 20px}header h1{font-size:27px;letter-spacing:-.7px;margin:2px 0 8px}header p{margin:0;color:var(--muted)}.eyebrow{font-size:12px;color:var(--green);letter-spacing:2px}.layout{display:grid;grid-template-columns:215px minmax(420px,1fr) 260px;gap:24px;max-width:1420px;margin:0 auto;padding:0 36px 36px}aside h2{font-size:14px;margin:14px 0 10px}nav{display:grid;gap:8px}nav button{text-align:left;padding:14px;background:transparent}nav button[aria-current=true]{background:#e5eadc;border-color:#b8c6a5;color:#344a29}nav small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.control{display:grid;gap:6px;margin:20px 0}select,input,textarea{width:100%;padding:10px;border:1px solid #cfd8c7;border-radius:7px;background:white;color:inherit}textarea{min-height:85px;resize:vertical}.workspace{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:620px}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:18px 22px}.identity{display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;width:40px;height:40px;background:#e8eddf;border-radius:10px;color:var(--green);font-size:23px}.identity strong{display:block}.identity small{color:var(--muted)}.badge{font-size:12px;border-radius:20px;background:#f2f0e7;color:#796330;padding:3px 10px;white-space:nowrap}.badge.done{background:#eaf1e4;color:#49673a}.conversation{padding:22px;display:grid;gap:18px}.user{background:#edf1e7;padding:12px 16px;border-radius:12px 12px 2px 12px;justify-self:end;max-width:88%}.message{max-width:100%}.message p{margin:0 0 10px}.card{border:1px solid var(--line);border-radius:10px;overflow:hidden}.card-head{padding:15px 18px;background:#f9faf6;border-bottom:1px solid var(--line)}.card-head h3{font-size:17px;margin:0}.card-head small{color:var(--muted)}.card-body{padding:18px;display:grid;gap:14px}.form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}label{display:grid;gap:6px;font-size:13px}.wide{grid-column:1/-1}label small{color:var(--muted);font-size:12px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 18px}.actions.flat{padding:0}.notice{padding:12px 14px;border-radius:8px;background:#f5f3e9;color:#746232;font-size:13px}.error{color:#a43b32;background:#fcf0ed;padding:10px 12px;border-radius:7px}.muted{color:var(--muted);font-size:13px}dl{margin:0;display:grid;grid-template-columns:100px 1fr;gap:9px 12px;font-size:14px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.side-note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;font-size:13px}.side-note p{color:var(--muted);margin:8px 0 16px}.side-note p:last-child{margin-bottom:0}.steps{margin:0;padding-left:20px}.steps li{margin:9px 0}.receipt{font-size:12px;font-family:ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.document{white-space:pre-wrap;line-height:1.9;background:#fcfcfa;padding:18px;border:1px solid var(--line);border-radius:8px}.status-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:#78915f}footer{border-top:1px solid var(--line);padding:15px 22px;font-size:12px;color:var(--muted)}@media(max-width:1100px){.layout{grid-template-columns:185px minmax(0,1fr)}.notes{grid-column:1/-1}.side-note{display:grid;grid-template-columns:1fr 1fr;gap:20px}}@media(max-width:720px){header{padding:20px}.layout{display:block;padding:0 16px 24px}nav{grid-template-columns:repeat(2,1fr)}.workspace{margin:20px 0}.form-grid{grid-template-columns:1fr}.side-note{display:block}.workspace-head{align-items:flex-start}.conversation{padding:16px}}
</style>
</head>
<body>
<header><span class="eyebrow">数字员工 · 交互设计</span><h1>对话、表单与人工协作</h1><p>可点击的前台设计示意。使用独立示例数据，未连接模型或业务系统。</p></header>
<div class="layout">
<aside><h2>选择场景</h2><nav aria-label="设计场景">
<button data-scene="document" aria-current="true">公文起草<small>表单收集 → 交付草稿</small></button>
<button data-scene="approval">业务审批<small>用户确认 → 有权人员审批</small></button>
<button data-scene="failure-off">异常 · 无人工兜底<small>停止并保留待核验记录</small></button>
<button data-scene="failure-on">异常 · 有人工兜底<small>等待接管 → 人工处理</small></button>
</nav><label class="control">查看视角（示意）<select id="viewer" aria-label="查看视角（示意）"><option value="requester">任务发起人</option><option value="approver">有权业务审批人</option><option value="handler">指定接管人员</option></select></label><button id="restart" class="subtle">重置当前示意</button><p class="muted">切换视角用于审阅设计，不代表真实权限授权。</p></aside>
<main class="workspace" aria-label="前台任务界面"><div id="screen"></div></main>
<aside class="notes"><div class="side-note"><div><h2>本场景的配置</h2><div id="config-note"></div></div><div><h2>统一交互约定</h2><ol class="steps"><li>复用已知信息，AI 预填需确认。</li><li>填写表单与审批是不同动作。</li><li>修改内容后，重新确认当前版本。</li><li>提交后的旧卡片只读，避免重复动作。</li><li>异常兜底不授予业务审批权。</li></ol></div></div></aside>
</div>
<script>
const scenes={
 document:{name:'公文写作专家',goal:'帮我起草一份校园安全培训通知。',fields:[{key:'title',label:'主题',value:'校园安全培训通知'},{key:'kind',label:'文种',options:['通知','请示','报告'],value:'通知'},{key:'audience',label:'发文对象',value:''},{key:'details',label:'主要内容',long:true,value:''}],intro:'主题和文种已根据你的描述预填，请补充发文对象和主要内容。',note:'用户交互：开始时填写表单。<br>人工兜底：关闭。<br>交付：一份可继续修改的草稿。'},
 approval:{name:'会议申请专家',goal:'帮我申请下周的项目评审会议场地。',fields:[{key:'title',label:'会议名称',value:'项目评审会议'},{key:'date',label:'会议时间',type:'datetime-local',value:''},{key:'room',label:'场地',options:['行政楼 201','教学楼报告厅'],value:'行政楼 201'},{key:'details',label:'申请说明',long:true,value:''}],intro:'请补充具体时间并核对场地。提交申请后，还需要业务审批人处理。',note:'用户交互：缺项时填写表单。<br>提交前：用户核对申请参数。<br>审批人：由场地业务系统确定。<br>配置责任人和接管人均不因此获得审批权限。'},
 'failure-off':{name:'会议申请专家',goal:'申请提交到业务系统了吗？',note:'人工兜底：关闭。<br>原业务动作结果未知，核验暂不可用。<br>停止后续操作，保留内容与待核验记录。'},
 'failure-on':{name:'会议申请专家',goal:'申请提交到业务系统了吗？',note:'人工兜底：开启。<br>指定接管人：林晓。<br>本例为结果核验失败后的接管。<br>业务审批权仍由业务系统确定。'}
};
let scene='document',viewer='requester';const states={};
function initial(key){return {phase:key==='failure-on'?'handoff':key==='failure-off'?'unknown':'collect',revision:1,values:Object.fromEntries((scenes[key].fields||[]).map(f=>[f.key,f.value])),confirmed:false,error:'',handlingNote:'',outcome:'',receipt:''}}
function current(){return states[scene]||(states[scene]=initial(scene))}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function details(s){return '<dl>'+(scenes[scene].fields||[]).map(f=>'<dt>'+f.label+'</dt><dd>'+esc(s.values[f.key])+'</dd>').join('')+'</dl>'}
function button(label,action,primary=false,disabled=false){return '<button type="button" data-action="'+action+'" class="'+(primary?'primary':'')+'" '+(disabled?'disabled':'')+'>'+label+'</button>'}
function render(){const c=scenes[scene],s=current(),owner=viewer==='requester';let body='';
 const status={collect:'待补充信息',review:'待确认操作',completed:'草稿已生成',approval:'等待业务审批',approved:'审批通过',rejected:'审批驳回',cancelled:'已取消',unknown:'结果待核验',handoff:'等待人工接管',handling:'人工处理中',resolved:s.outcome==='verified'?'已核验原动作':'结果仍待核验'}[s.phase];
 if(s.phase==='collect'){
  body='<p>'+c.intro+'</p><form id="task-form"><div class="card"><div class="card-head"><h3>'+(scene==='document'?'填写起草要求':'补充申请信息')+'</h3><small>填写后继续当前任务 · 第 '+s.revision+' 版</small></div><div class="card-body"><div class="form-grid">'+c.fields.map(f=>'<label class="'+(f.long?'wide':'')+'">'+f.label+' *'+(f.options?'<select name="'+f.key+'" required '+(!owner?'disabled':'')+'>'+f.options.map(x=>'<option '+(s.values[f.key]===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':f.long?'<textarea name="'+f.key+'" required maxlength="1000" '+(!owner?'disabled':'')+'>'+esc(s.values[f.key])+'</textarea>':'<input name="'+f.key+'" type="'+(f.type||'text')+'" required maxlength="120" value="'+esc(s.values[f.key])+'" '+(!owner?'disabled':'')+'>')+'</label>').join('')+'</div><label class="check"><input name="confirmed" type="checkbox" '+(s.confirmed?'checked':'')+' '+(!owner?'disabled':'')+'>我已核对预填内容</label>'+(s.error?'<div class="error" role="alert">'+esc(s.error)+'</div>':'')+(!owner?'<p class="muted">此表单由任务发起人填写。</p>':'')+'</div><div class="actions"><button class="primary" type="submit" '+(!owner?'disabled':'')+'>保存并继续</button>'+button('取消任务','cancel',false,!owner)+'</div></div></form>';
 }else if(s.phase==='review'){
  body='<p>信息已收齐。请核对即将提交的申请内容。</p><div class="card"><div class="card-head"><h3>提交场地申请前确认</h3><small>核对第 '+s.revision+' 版内容</small></div><div class="card-body">'+details(s)+'<div class="notice">确认后将创建业务申请单，进入审批流程。当前确认不代表审批通过。</div></div><div class="actions">'+button('确认提交申请','submit',true,!owner)+button('返回修改','edit',false,!owner)+button('取消任务','cancel',false,!owner)+'</div></div>';
 }else if(s.phase==='completed'){
  body='<p>已根据你填写的信息生成草稿，你可以继续修改。</p><div class="card"><div class="card-head"><h3>'+esc(s.values.title)+'</h3><small>公文草稿</small></div><div class="card-body"><div class="document">'+esc(s.values.audience)+'：\n\n'+esc(s.values.details)+'\n\n请结合实际安排核对并完善此稿。</div><p class="muted">起草任务已完成。正式发文所需审核按学校流程办理。</p><span class="receipt">交付记录：DOC-'+s.revision+'</span></div><div class="actions">'+button('修改起草要求','edit',false,!owner)+'</div></div>';
 }else if(['approval','approved','rejected'].includes(s.phase)){
  body='<p>'+(s.phase==='approval'?'申请已提交，正在等待有权业务人员审批。':s.phase==='approved'?'业务系统已返回审批通过的记录。':'申请被驳回，原申请内容与处理意见已保留。')+'</p><div class="card"><div class="card-head"><h3>场地申请单</h3><small>'+esc(s.receipt)+'</small></div><div class="card-body">'+details(s)+'<dl><dt>审批岗位</dt><dd>场地管理员 · 业务系统认定</dd><dt>当前状态</dt><dd>'+status+'</dd></dl><p class="muted">提交表单和配置兜底人员均不授予审批权限。</p></div>'+(s.phase==='approval'?'<div class="actions">'+(viewer==='approver'?button('审批通过','approve',true)+button('驳回申请','reject'): '<span class="muted">当前身份可查看进度，由有权业务审批人处理。</span>')+'</div>':'')+'</div>';
 }else if(s.phase==='cancelled'){
  body='<div class="notice">任务已取消，未发起后续业务动作。此前填写的内容保留为只读记录。</div><div class="card"><div class="card-body">'+details(s)+'</div></div>';
 }else{
  const phaseText={unknown:'原申请是否提交成功暂时无法确定。已停止后续动作，保留待核验记录。',handoff:'原动作暂时无法核验，已进入人工接管队列。',handling:'林晓正在核对原业务动作。',resolved:s.outcome==='verified'?'已核验原申请提交成功，审批仍按业务系统流程进行。':'本次人工处理未能确认业务结果，记录继续保持待核验。'}[s.phase];
  body='<p>'+phaseText+'</p><div class="card"><div class="card-head"><h3>申请提交状态核验</h3><small>保留原动作，不重新发送</small></div><div class="card-body"><dl><dt>原动作</dt><dd>ACT-MEETING-001</dd><dt>已完成</dt><dd>申请信息校验、用户提交确认</dd><dt>未确定</dt><dd>业务系统是否成功创建申请</dd><dt>失败原因</dt><dd>请求超时，状态查询暂不可用</dd>'+(scene==='failure-on'?'<dt>接管人员</dt><dd>林晓'+(s.phase==='handoff'?' · 等待领取':'')+'</dd>':'')+'</dl><div class="notice">未确认原动作结果前，不能再次发送，也不能标记业务完成。</div>'+(s.phase==='handling'&&viewer==='handler'?'<label>核验结果<select id="outcome" aria-label="核验结果"><option value="">请选择核验结果</option><option value="verified" '+(s.outcome==='verified'?'selected':'')+'>已确认原申请提交成功</option><option value="unknown" '+(s.outcome==='unknown'?'selected':'')+'>结果仍无法核验</option></select></label><label>处理记录 *<textarea id="handling-note" maxlength="1000">'+esc(s.handlingNote)+'</textarea></label>':'')+(s.phase==='resolved'?'<dl><dt>处理记录</dt><dd>'+esc(s.handlingNote)+'</dd></dl>':'')+(s.error?'<div class="error" role="alert">'+esc(s.error)+'</div>':'')+'</div><div class="actions">'+(s.phase==='handoff'?(viewer==='handler'?button('领取并处理','claim',true):'<span class="muted">等待指定接管人员领取，任务尚未由人工处理。</span>'):s.phase==='handling'?(viewer==='handler'?button('登记处理结果','resolve',true):'<span class="muted">人工处理中，可查看处理进度。</span>'):'<span class="muted">当前记录只读，不会自动重试业务动作。</span>')+'</div></div>';
 }
 document.getElementById('screen').innerHTML='<div class="workspace-head"><div class="identity"><span class="avatar">✦</span><div><strong>'+c.name+'</strong><small>当前任务 · 独立交互示意</small></div></div><span class="badge '+(['completed','approved'].includes(s.phase)||s.phase==='resolved'&&s.outcome==='verified'?'done':'')+'">'+status+'</span></div><div class="conversation"><div class="user">'+c.goal+'</div><div class="message">'+body+'</div></div><footer><span class="status-line"><span class="dot"></span>对话、表单与处理进度均属于同一个任务</span></footer>';
 document.getElementById('config-note').innerHTML='<p>'+c.note+'</p>';
 document.querySelectorAll('[data-scene]').forEach(el=>el.setAttribute('aria-current',String(el.dataset.scene===scene)));
}
document.addEventListener('input',event=>{const s=current(),el=event.target;if(el.closest('#task-form')&&viewer==='requester'){if(el.name==='confirmed')s.confirmed=el.checked;else if(el.name)s.values[el.name]=el.value;}if(el.id==='handling-note'&&viewer==='handler')s.handlingNote=el.value;});
document.addEventListener('change',event=>{if(event.target.id==='outcome'&&viewer==='handler')current().outcome=event.target.value;});
document.addEventListener('submit',event=>{if(event.target.id!=='task-form')return;event.preventDefault();const s=current();if(s.phase!=='collect'||viewer!=='requester')return;if(!s.confirmed){s.error='请先核对并确认预填内容。';render();return;}if(scenes[scene].fields.some(f=>!String(s.values[f.key]||'').trim())){s.error='请补齐必填信息。';render();return;}s.error='';s.phase=scene==='document'?'completed':'review';render();});
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.dataset.scene){scene=el.dataset.scene;render();return;}if(el.id==='restart'){states[scene]=initial(scene);render();return;}const s=current(),action=el.dataset.action;
 if(action==='cancel'&&viewer==='requester'&&['collect','review'].includes(s.phase))s.phase='cancelled';
 else if(action==='edit'&&viewer==='requester'&&['review','completed'].includes(s.phase)){s.phase='collect';s.revision++;s.confirmed=false;}
 else if(action==='submit'&&viewer==='requester'&&s.phase==='review'){s.phase='approval';s.receipt='APPLICATION-'+s.revision;}
 else if(action==='approve'&&viewer==='approver'&&s.phase==='approval')s.phase='approved';
 else if(action==='reject'&&viewer==='approver'&&s.phase==='approval')s.phase='rejected';
 else if(action==='claim'&&viewer==='handler'&&s.phase==='handoff')s.phase='handling';
 else if(action==='resolve'&&viewer==='handler'&&s.phase==='handling'){if(!s.outcome)s.error='请选择核验结果。';else if(!s.handlingNote.trim())s.error='请填写处理记录。';else{s.error='';s.phase='resolved';}}
 else return;render();
});
document.getElementById('viewer').addEventListener('change',event=>{viewer=event.target.value;render();});
render();
</script>
</body>
</html>
